[project]
name = "jarvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vlad", email = "hudakovvlad8@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "blessed>=1.45.0",
    "dotenv>=0.9.9",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "google-genai>=2.10.0",
    "numpy>=2.5.0",
    "pgvector>=0.5.0",
    "pyaudio>=0.2.14",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
jarvis = "jarvis:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
